[package]
name = "sic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "sic"
path = "src/main.rs"

[dependencies]
sic-ir        = { path = "../sic-ir" }
sic-frontend  = { path = "../sic-frontend" }
sic-opt       = { path = "../sic-opt" }
sic-cranelift = { path = "../sic-cranelift" }
sic-link      = { path = "../sic-link" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[package]
name = "sic-cranelift"
version.workspace = true
edition.workspace = true

[dependencies]
sic-ir = { path = "../sic-ir" }
cranelift-codegen  = { version = "0.113", features = ["all-arch"] }
cranelift-frontend = "0.113"
cranelift-object   = "0.113"
cranelift-module   = "0.113"
target-lexicon     = "0.12"
cranelift-native   = "0.113"
thiserror          = "1"
# DWARF debug-info emission (line tables + compile unit). `gimli`'s write side
# and the `object` writer match the versions cranelift-object already uses.
gimli              = { version = "0.31", default-features = false, features = ["write"] }
object             = { version = "0.36", default-features = false, features = ["write"] }

[package]
name = "sic-cranelift"
version.workspace = true
edition.workspace = true

[dependencies]
sic-ir = { path = "../sic-ir" }
# No "disas": it builds the capstone C library (sic never disassembles), and
# sic must build without a C compiler.
cranelift-codegen  = { version = "0.137.0", features = ["all-arch"] }
cranelift-frontend = "0.137.0"
cranelift-object   = "0.137.0"
cranelift-module   = "0.137.0"
target-lexicon     = "0.13"
cranelift-native   = "0.137.0"
thiserror          = "2"
# DWARF debug-info emission (line tables + compile unit). `gimli`'s write side
# and the `object` writer must match the versions cranelift-object 0.137 uses
# (gimli is only used to build our own sections, so it may be newer).
gimli              = { version = "0.34", default-features = false, features = ["write"] }
object             = { version = "0.40", default-features = false, features = ["write", "build"] }

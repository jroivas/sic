[package]
name = "sic-cranelift"
version.workspace = true
edition.workspace = true

[dependencies]
sic-ir = { path = "../sic-ir" }
cranelift-codegen  = { version = "0.132", features = ["all-arch", "disas"] }
cranelift-frontend = "0.132"
cranelift-object   = "0.132"
cranelift-module   = "0.132"
target-lexicon     = "0.13"
cranelift-native   = "0.132"
thiserror          = "1"
# DWARF debug-info emission (line tables + compile unit). `gimli`'s write side
# and the `object` writer must match the versions cranelift-object 0.132 uses.
gimli              = { version = "0.31", default-features = false, features = ["write"] }
object             = { version = "0.39", default-features = false, features = ["write"] }
